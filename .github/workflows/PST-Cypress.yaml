name: Cypress Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  cypress-tests:
    runs-on: ubuntu-latest

    env:
      K8S_NAMESPACE: toolshop-ci-${{ github.run_id }}
      REGISTRY: europe-west1-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/toolshop
      BASE_URL: http://localhost:8080

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Required for accurate diffing if needed

      - name: Check for changes in Cypress files
        id: changes
        uses: dorny/paths-filter@v3
        with:
          filters: |
            cypress:
              - 'cypress/**'
              - 'cypress.config.js'
              - 'entrypoint.cypress.cjs'
              - '_docker/Dockerfile.cypress'
              - 'k8s/pst-cypress.yaml'
              - 'package.json'
              - 'package-lock.json'
              - '.github/workflows/PST-Cypress.yaml'

      - name: Set up gcloud auth
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker europe-west1-docker.pkg.dev --quiet

      - name: Build and Push Cypress Image
        if: steps.changes.outputs.cypress == 'true' || (github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'force-build'))
        id: build
        run: |
          set -euo pipefail
          IMAGE_URI="${{ env.REGISTRY }}/cypress-k8s:latest"
          docker build -t "$IMAGE_URI" -f _docker/Dockerfile.cypress .
          docker push "$IMAGE_URI"

      - name: Get GKE credentials
        uses: google-github-actions/get-gke-credentials@v2
        with:
          project_id: ${{ secrets.GCP_PROJECT_ID }}
          cluster_name: ${{ secrets.GKE_CLUSTER_NAME }}
          location: ${{ secrets.GKE_LOCATION }}

      - name: Create namespace
        run: kubectl create namespace "$K8S_NAMESPACE"

      - name: Create test secret
        run: |
          kubectl create secret generic pst-test-secret \
            -n "$K8S_NAMESPACE" \
            --from-literal=SLACK_WEBHOOK_URL="${{ secrets.SLACK_WEBHOOK_URL }}" \
            --from-literal=ADMIN_USER_EMAIL="${{ secrets.ADMIN_USER_EMAIL }}" \
            --from-literal=ADMIN_USER_PASSWORD="${{ secrets.ADMIN_USER_PASSWORD }}" \
            --from-literal=USER_EMAIL="${{ secrets.USER_EMAIL }}" \
            --from-literal=USER_PASSWORD="${{ secrets.USER_PASSWORD }}"

      - name: Apply DB secrets
        run: kubectl apply -n "$K8S_NAMESPACE" -f k8s/pst-db-secret.yaml

      - name: Deploy Toolshop app
        run: |
          kubectl apply -n "$K8S_NAMESPACE" -f k8s/pst-db.yaml
          kubectl apply -n "$K8S_NAMESPACE" -f k8s/pst-api.yaml
          kubectl apply -n "$K8S_NAMESPACE" -f k8s/pst-apiweb.yaml
          kubectl apply -n "$K8S_NAMESPACE" -f k8s/pst-web.yaml
          kubectl apply -n "$K8S_NAMESPACE" -f k8s/pst-cron.yaml

      - name: Wait for deployments to be ready
        run: |
          set -euo pipefail
          kubectl rollout status deployment/pst-db -n "$K8S_NAMESPACE" --timeout=120s || true
          kubectl rollout status deployment/pst-api -n "$K8S_NAMESPACE" --timeout=180s
          kubectl rollout status deployment/pst-web -n "$K8S_NAMESPACE" --timeout=180s
          kubectl rollout status deployment/pst-apiweb -n "$K8S_NAMESPACE" --timeout=180s

      - name: Wait for DB to be reachable
        run: |
          set -euo pipefail
          kubectl run db-waiter --rm -i -n "$K8S_NAMESPACE" --image=busybox --restart=Never -- \
            sh -c 'until nc -z -w3 pst-db 3306; do echo "Waiting for DB..."; sleep 3; done'

      - name: Prepare DB (permissions + migrate + seed)
        run: |
          set -euo pipefail
          kubectl exec -n "$K8S_NAMESPACE" deploy/pst-api -- \
            sh -c 'chmod -R 777 storage bootstrap/cache && php artisan migrate:fresh --seed --force --no-interaction'

      - name: Apply Cypress test job
        run: kubectl apply -n "$K8S_NAMESPACE" -f k8s/pst-cypress.yaml

      - name: Wait for Cypress test pod
        run: |
          set -euo pipefail
          for _ in $(seq 1 60); do
            POD_NAME=$(kubectl get pods -n "$K8S_NAMESPACE" -l job-name=pst-cypress-tests -o jsonpath='{.items[0].metadata.name}' 2>/dev/null || true)
            if [ -n "$POD_NAME" ]; then
              echo "Cypress pod: $POD_NAME"
              exit 0
            fi
            sleep 5
          done
          echo "Timed out waiting for the Cypress test pod to be created."
          exit 1

      - name: Wait for Test Completion
        run: |
          set -euo pipefail
          echo "Waiting for Cypress job to complete..."
          kubectl wait --for=condition=complete job/pst-cypress-tests -n "$K8S_NAMESPACE" --timeout=900s || true

          POD_NAME=$(kubectl get pods -n "$K8S_NAMESPACE" -l job-name=pst-cypress-tests -o jsonpath='{.items[0].metadata.name}')
          if [ -z "$POD_NAME" ]; then
            echo "Cypress pod not found."
            exit 1
          fi

          TEST_EXIT_CODE=""
          for _ in $(seq 1 30); do
            TEST_EXIT_CODE=$(kubectl get pod -n "$K8S_NAMESPACE" "$POD_NAME" -o jsonpath='{.status.containerStatuses[0].state.terminated.exitCode}' 2>/dev/null || true)
            if [ -n "$TEST_EXIT_CODE" ]; then
              break
            fi
            sleep 2
          done

          if [ -z "$TEST_EXIT_CODE" ]; then
            echo "Could not determine Cypress exit code from pod status."
            kubectl describe pod -n "$K8S_NAMESPACE" "$POD_NAME" || true
            exit 1
          fi

          echo "Fetching Cypress test pod logs for debugging..."
          kubectl logs -n "$K8S_NAMESPACE" "$POD_NAME"
          echo "Cypress exited with code: $TEST_EXIT_CODE"

          if [ "$TEST_EXIT_CODE" -ne "0" ]; then
            echo "Tests failed! Exiting pipeline with error."
            exit 1
          fi

      - name: Copy and Upload Artifacts
        if: always()
        run: |
          set -euo pipefail
          POD_NAME=$(kubectl get pods -l job-name=pst-cypress-tests -n "$K8S_NAMESPACE" -o jsonpath='{.items[0].metadata.name}')
          if [ -n "$POD_NAME" ]; then
            mkdir -p ./cypress-artifacts/screenshots ./cypress-artifacts/videos
            kubectl cp -n "$K8S_NAMESPACE" "$POD_NAME:/tests/cypress/screenshots" ./cypress-artifacts/screenshots || true
            kubectl cp -n "$K8S_NAMESPACE" "$POD_NAME:/tests/cypress/videos" ./cypress-artifacts/videos || true
          fi

      - name: Upload Artifacts to GitHub
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cypress-results
          path: cypress-artifacts/
          if-no-files-found: ignore

      - name: Delete namespace
        if: always()
        run: |
          set -euo pipefail
          if [ "${{ job.status }}" == "failure" ]; then sleep 60; fi
          kubectl delete namespace "$K8S_NAMESPACE" --wait=false
